# Ablation — larger rank + MLP modules (more params, more capacity).
run_name: rank32_allmodules

model_name: Qwen/Qwen2.5-0.5B-Instruct
use_4bit: true

lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

num_epochs: 3
batch_size: 4
grad_accum_steps: 4
learning_rate: 2.0e-4
lr_scheduler: cosine
warmup_ratio: 0.03
