# Ablation — smaller LoRA rank (fewer trainable params, faster, may underfit).
run_name: rank8

model_name: Qwen/Qwen2.5-0.5B-Instruct
use_4bit: true

lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

num_epochs: 3
batch_size: 4
grad_accum_steps: 4
learning_rate: 2.0e-4
lr_scheduler: cosine
warmup_ratio: 0.03
