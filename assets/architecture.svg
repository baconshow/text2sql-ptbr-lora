<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <text x="30" y="44" fill="#f1f5f9" font-size="22" font-weight="700">Text-to-SQL PT-BR · QLoRA Pipeline</text>
  <text x="30" y="68" fill="#94a3b8" font-size="13">Synthetic data generation → QLoRA fine-tune → eval on held-out test → HF Hub publish</text>

  <!-- Stage 1: Data -->
  <g transform="translate(30,100)">
    <rect width="200" height="140" rx="14" fill="url(#card)" stroke="#334155"/>
    <rect width="200" height="4" rx="2" fill="url(#accent)"/>
    <text x="16" y="32" fill="#f1f5f9" font-size="14" font-weight="700">1 · Synthetic Data</text>
    <text x="16" y="58" fill="#cbd5e1" font-size="12">4 domains · 15 templates</text>
    <text x="16" y="78" fill="#cbd5e1" font-size="12">3 000 examples (train/val/test)</text>
    <text x="16" y="98" fill="#cbd5e1" font-size="12">JSONL · chat-format</text>
    <text x="16" y="122" fill="#64748b" font-size="11">src/data_prep.py</text>
  </g>

  <!-- Stage 2: Train -->
  <g transform="translate(270,100)">
    <rect width="220" height="140" rx="14" fill="url(#card)" stroke="#334155"/>
    <rect width="220" height="4" rx="2" fill="url(#accent)"/>
    <text x="16" y="32" fill="#f1f5f9" font-size="14" font-weight="700">2 · QLoRA Fine-tune</text>
    <text x="16" y="58" fill="#cbd5e1" font-size="12">Qwen2.5-0.5B-Instruct</text>
    <text x="16" y="78" fill="#cbd5e1" font-size="12">4-bit NF4 · PEFT · bitsandbytes</text>
    <text x="16" y="98" fill="#cbd5e1" font-size="12">Ablations: r ∈ {8,16,32} · LR sweep</text>
    <text x="16" y="122" fill="#64748b" font-size="11">Colab T4 · ~25 min/run</text>
  </g>

  <!-- Stage 3: Eval -->
  <g transform="translate(530,100)">
    <rect width="200" height="140" rx="14" fill="url(#card)" stroke="#334155"/>
    <rect width="200" height="4" rx="2" fill="url(#accent)"/>
    <text x="16" y="32" fill="#f1f5f9" font-size="14" font-weight="700">3 · Evaluate</text>
    <text x="16" y="58" fill="#cbd5e1" font-size="12">Exact Match</text>
    <text x="16" y="78" fill="#cbd5e1" font-size="12">Token F1</text>
    <text x="16" y="98" fill="#cbd5e1" font-size="12">SQL parse validity</text>
    <text x="16" y="122" fill="#64748b" font-size="11">src/evaluate.py</text>
  </g>

  <!-- Stage 4: Publish -->
  <g transform="translate(770,100)">
    <rect width="160" height="140" rx="14" fill="url(#card)" stroke="#334155"/>
    <rect width="160" height="4" rx="2" fill="url(#accent)"/>
    <text x="16" y="32" fill="#f1f5f9" font-size="14" font-weight="700">4 · Publish</text>
    <text x="16" y="58" fill="#cbd5e1" font-size="12">🤗 HF Hub adapter</text>
    <text x="16" y="78" fill="#cbd5e1" font-size="12">Model card</text>
    <text x="16" y="98" fill="#cbd5e1" font-size="12">Ablation report</text>
  </g>

  <!-- Arrows -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M230,170 L270,170"/>
    <path d="M490,170 L530,170"/>
    <path d="M730,170 L770,170"/>
  </g>

  <!-- Bottom row: stack -->
  <g transform="translate(30,290)">
    <text x="0" y="0" fill="#64748b" font-size="12" font-weight="600">STACK</text>
    <g font-size="12" fill="#e2e8f0">
      <g transform="translate(0,14)">
        <rect width="100" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="50" y="18" text-anchor="middle">PyTorch</text>
      </g>
      <g transform="translate(110,14)">
        <rect width="140" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="70" y="18" text-anchor="middle">🤗 Transformers</text>
      </g>
      <g transform="translate(260,14)">
        <rect width="70" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="35" y="18" text-anchor="middle">PEFT</text>
      </g>
      <g transform="translate(340,14)">
        <rect width="110" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="55" y="18" text-anchor="middle">bitsandbytes</text>
      </g>
      <g transform="translate(460,14)">
        <rect width="90" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="45" y="18" text-anchor="middle">Accelerate</text>
      </g>
      <g transform="translate(560,14)">
        <rect width="80" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="40" y="18" text-anchor="middle">Datasets</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <text x="30" y="390" fill="#475569" font-size="11">github.com/baconshow/text2sql-ptbr-lora · MIT License</text>
</svg>
